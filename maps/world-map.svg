<!-- Habitat markers use the shared geometry in world-land.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" class="world-map" viewBox="0 55 1000 415" role="img" aria-label="World map with linked animal habitat markers">
<style>.map-graticule {
  fill:none;
  stroke:#b4c5a2;
  stroke-width:.5;
  opacity:.28
}
.map-land {
  fill:#cfd9bc;
  stroke:#e8efdf;
  stroke-width:.65;
  stroke-linejoin:round
}
.map-pin .pin-target {
  fill:transparent;
  stroke:none;
  pointer-events:all
}
.map-pin .pin-ring {
  fill:#c67b5e;
  opacity:.18;
  transition:r .25s
}
.map-pin .pin-core {
  fill:#b86b50;
  stroke:#f6f5e7;
  stroke-width:2;
  transition:r .2s
}
.map-pin.en .pin-ring {
  fill:#aa8e3c
}
.map-pin.en .pin-core {
  fill:#b69a45
}
.map-pin:hover .pin-ring,.map-pin:focus .pin-ring,.map-pin.selected .pin-ring {
  r:14;
  opacity:.3
}
.map-pin:hover .pin-core,.map-pin:focus .pin-core,.map-pin.selected .pin-core {
  r:5.5
}
.map-pin.dimmed {
  display:none
}
.map-pin {
  outline:none
}
.map-pin:focus .pin-core {
  stroke:#183c2a;
  stroke-width:3
}
.map-ocean-label {
  font-size:8px;
  fill:#8a9b7d;
  letter-spacing:2.2px;
  text-anchor:middle;
  pointer-events:none
}</style>
      

<g class="map-viewport">
        

